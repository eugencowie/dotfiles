name: Renovate

on:
  schedule:
    # Schedules aren't reliable, spam runs in the hope of landing in the Renovate window
    - cron: "30 18-23 * * 0"
    - cron: "30 0-3 * * 1"
    # Update more frequently to keep the system packages up-to-date
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          renovate-version: 44.104.2@sha256:c87b1c55ab98286dad9df0c1d84ebe1fbe2a805a68d48dd7a6d577709bf951a7
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          # Share Renovate's checkout and the host Nix installation
          docker-volumes: "/tmp:/tmp ; /nix:/nix"
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '[".+"]'
          # Renovate filters child environments, so pass the token and host Nix connection explicitly
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"GH_TOKEN":"${{ github.token }}","T3CODE_NIX_BIN":"/nix/var/nix/profiles/default/bin/nix","T3CODE_NIX_STORE":"unix:///nix/var/nix/daemon-socket/socket"}
