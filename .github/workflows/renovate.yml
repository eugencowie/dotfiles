name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        with:
          renovate-version: 44.75.0@sha256:f45487eed297e0b29ca0bfa75843ac68b7669921c6f1bdca3de201df8df3ff4e
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          # Share Renovate's checkout and the host Nix installation
          docker-volumes: '/tmp:/tmp ; /nix:/nix'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[".+"]'
          # Renovate filters child environments, so pass the token and host Nix connection explicitly
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"GH_TOKEN":"${{ github.token }}","T3CODE_NIX_BIN":"/nix/var/nix/profiles/default/bin/nix","T3CODE_NIX_STORE":"unix:///nix/var/nix/daemon-socket/socket"}
