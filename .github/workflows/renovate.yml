name: Renovate

on:
  schedule:
    # Schedules aren't reliable, spam runs in the hope of landing in the Renovate window
    - cron: "30 18-23 * * 0"
    - cron: "30 0-3 * * 1"
    # Update more frequently to keep the system packages up-to-date
    - cron: "30 */6 * * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}

  # Renovate only refreshes its flake.lock maintenance PR on rebase, so it goes
  # stale. This force-pushes the same branch every run, so the PR stays current.
  update-flake-lock:
    if: github.event.schedule == '30 */6 * * *' || github.event_name == 'workflow_dispatch'
    name: Update flake lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3

      - name: Update flake lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          branch: update/flake-lock
          pr-title: Update flake lock
          commit-msg: Update flake lock
          pr-labels: chore
