name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          renovate-version: 44.65.5@sha256:4e10f76a79f1c597f427f83c788a9f5b14a6295784c4cb68307b89b0a954abce
          token: ${{ secrets.RENOVATE_TOKEN || github.token }}
          # Share Renovate's checkout and the host Nix installation
          docker-volumes: '/tmp:/tmp ; /nix:/nix'
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_ALLOWED_COMMANDS: '[".+"]'
          # Renovate filters child environments, so pass the token and host Nix connection explicitly
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"GH_TOKEN":"${{ github.token }}","T3CODE_NIX_BIN":"/nix/var/nix/profiles/default/bin/nix","T3CODE_NIX_STORE":"unix:///nix/var/nix/daemon-socket/socket"}
