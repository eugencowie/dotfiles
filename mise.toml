[plugins]
nix = "https://github.com/jbadeau/mise-nix#e310c4c20e8273ba850298c10fbe97d0c858c300" # 0.21.0

[tools]
"nix:cruft" = "latest"
"nix:deadnix" = "latest"
"nix:gh" = "latest"
"nix:nixd" = "latest"

[tasks.codegen]
description = "Regenerate flake file"
run = "nix run .#write-flake"

[tasks.check]
description = "Verify flake evaluates and perform checks"
depends = ["codegen"]
run = [
  "nix flake check",
  "deadnix --fail --exclude hardware -- ."
]

[tasks.update]
description = "Update lock file"
depends = ["codegen"]
run = "nix flake update"

[tasks."update:auth"]
description = "Update lock file using GitHub token"
run = ['nix flake update --option access-tokens "github.com=$(gh auth token)"']

[tasks."update:t3code"]
description = "Update T3 Code nightly and its fixed-output hashes"
run = "./scripts/update-t3code-nightly"

[tasks.hardware]
description = "Regenerate hardware configuration for this machine"
run = [
  'mkdir -p "hardware/$(hostname)"',
  'nixos-generate-config --show-hardware-config > "hardware/$(hostname)/hardware-configuration.nix"'
]

[tasks.apply]
description = "Activate system configuration (requires password)"
depends = ["codegen"]
run = '''
case "$(uname -s)" in
  Darwin) sudo darwin-rebuild switch --flake . ;;
  *)      sudo  nixos-rebuild switch --flake . ;;
esac
'''

[tasks."template:update"]
description = "Update project with the latest changes from the template"
run = "cruft update"

[tasks."template:restore"]
description = "Restore template-managed files"
run = "cruft diff | git apply"
