[tasks.lint]
description = "Run static linters"
run = [
  "nix run --inputs-from . nixpkgs#deadnix -- --fail --exclude hardware -- .",
  # Uses the jactionlint override in modules/lint.nix; switch back to
  # nixpkgs#jactionlint when that override is dropped.
  "nix shell .#jactionlint --inputs-from . nixpkgs#shellcheck -c jactionlint"
]

[tasks.codegen]
description = "Regenerate flake file"
run = "nix run .#write-flake"

[tasks.check]
description = "Evaluate and check flake"
depends = ["codegen"]
run = "nix flake check"

[tasks.update]
description = "Update lock file"
depends = ["codegen"]
run = "nix flake update"

[tasks."update:auth"]
description = "Update lock file using GitHub token"
run = ['nix flake update --option access-tokens "github.com=$(nix run --inputs-from . nixpkgs#gh -- auth token)"']

[tasks.hardware]
description = "Regenerate hardware configuration for this machine"
run = [
  'mkdir -p "hardware/$(hostname)"',
  'nixos-generate-config --show-hardware-config > "hardware/$(hostname)/hardware-configuration.nix"'
]

[tasks.apply]
description = "Activate system configuration (requires password)"
depends = ["codegen"]
run = '''
case "$(uname -s)" in
  Darwin) sudo darwin-rebuild switch --flake . ;;
  *)      sudo  nixos-rebuild switch --flake . ;;
esac
'''
